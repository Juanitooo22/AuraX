name: Start AuraX
on:
  schedule:
    - cron: '0 17 * * *'
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Start instance
        run: |
          curl -X PUT "https://console.vast.ai/api/v0/instances/${{ secrets.VAST_INSTANCE_ID }}/" \
          -H "Authorization: Bearer ${{ secrets.VAST_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"state": "running"}'
